<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 16px;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 svg {
      flex-shrink: 0;
    }

    .input-group {
      display: flex;
      gap: 6px;
    }

    input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #2a2a2a;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }

    input::placeholder {
      color: #666;
    }

    input:focus {
      border-color: #3ea6ff;
    }

    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #3ea6ff;
      color: #000;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #65b8ff;
    }

    .error {
      color: #ff4444;
      font-size: 11px;
      margin-top: 6px;
      display: none;
    }

    .hint {
      color: #888;
      font-size: 11px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>
    <svg height="18" viewBox="0 0 24 24" width="18" fill="none">
      <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v4.7c0 4.83-3.23 9.36-7 10.57-3.77-1.21-7-5.74-7-10.57V6.3l7-3.12z" fill="#3ea6ff"/>
      <path d="M10 12l-2-2-1.41 1.41L10 14.82l6-6L14.59 7.4 10 12z" fill="#3ea6ff"/>
    </svg>
    YouTube Video Modifier
  </h1>

  <div class="input-group">
    <input type="text" id="videoUrl" placeholder="Paste YouTube link here...">
    <button id="openBtn">Open</button>
  </div>

  <div class="error" id="error">Invalid YouTube link</div>
  <div class="hint">Opens video in privacy mode (no ads)</div>

  <script src="popup.js"></script>
</body>
</html>
